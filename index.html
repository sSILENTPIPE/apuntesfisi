<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Física 2º bach</title>
<meta name="description" content="Física 2º bach">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{
  --tinta:#0E1834;
  --tinta-2:#17234A;
  --tinta-3:#26355F;
  --papel:#F4F6FB;
  --blanco:#FFFFFF;
  --texto:#14203F;
  --texto-2:#4E5B7C;
  --texto-3:#7B87A4;
  --borde:#DBE2F0;
  --borde-2:#C6D0E6;
  --campo:#2B4CE0;
  --campo-claro:#EAEEFD;
  --energia:#E9930B;
  --energia-claro:#FDF2DC;
  --verde:#12805C;
  --verde-claro:#E4F4EE;
  --rojo:#C0322B;
  --rojo-claro:#FBEBEA;
  --rail:284px;
  --sans:"Bricolage Grotesque","Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --radio:10px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--papel);
  color:var(--texto);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.sans{font-family:var(--sans);letter-spacing:-0.015em}
a{color:var(--campo)}
:focus-visible{outline:3px solid var(--energia);outline-offset:2px;border-radius:4px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.rail{
  background:var(--tinta);
  color:#C9D3EC;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  border-right:1px solid #000;
}
.rail__marca{padding:22px 22px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.rail__marca button{
  all:unset;cursor:pointer;display:block;width:100%;
}
.rail__titulo{font-family:var(--sans);font-weight:800;font-size:19px;color:#fff;line-height:1.15;letter-spacing:-0.02em}
.rail__sub{font-family:var(--sans);font-size:12.5px;color:#8FA0C8;margin-top:5px;line-height:1.35}

.rail__scroll{overflow-y:auto;flex:1;padding:12px 12px 28px;scrollbar-width:thin;scrollbar-color:#3A4874 transparent}
.rail__scroll::-webkit-scrollbar{width:8px}
.rail__scroll::-webkit-scrollbar-thumb{background:#33406A;border-radius:8px}

.rail__grupo{font-family:var(--sans);font-size:11.5px;font-weight:600;color:#7285B4;padding:16px 10px 7px;letter-spacing:.03em}

.nav-item{
  display:flex;gap:11px;align-items:flex-start;width:100%;
  background:none;border:0;cursor:pointer;text-align:left;
  color:#BDC8E4;font-family:var(--sans);font-size:14.2px;line-height:1.32;
  padding:8px 10px;border-radius:8px;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item[aria-current="true"]{background:#22315C;color:#fff}
.nav-item[aria-current="true"]::before{
  content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;
  background:var(--energia);border-radius:0 3px 3px 0;
}
.nav-item__n{
  flex:none;width:22px;height:22px;border-radius:6px;
  background:rgba(255,255,255,.09);color:#9FAFD6;
  font-size:11.5px;font-weight:600;display:grid;place-items:center;margin-top:1px;
}
.nav-item[aria-current="true"] .nav-item__n{background:var(--campo);color:#fff}
.nav-item.hecho .nav-item__n{background:var(--verde);color:#fff}
.nav-item.hecho .nav-item__n::after{content:"✓"}
.nav-item.hecho .nav-item__n span{display:none}
.nav-item__txt{flex:1;min-width:0}

.rail__pie{padding:12px 20px 16px;border-top:1px solid rgba(255,255,255,.09);font-family:var(--sans);font-size:12px;color:#7285B4}
.barra{height:5px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:7px 0}
.barra i{display:block;height:100%;background:var(--energia);width:0;transition:width .35s ease}

/* ---------- cabecera móvil ---------- */
.topbar{display:none}

/* ---------- contenido ---------- */
.main{min-width:0}
.vista{max-width:860px;margin:0 auto;padding:44px 40px 110px}
.vista--ancha{max-width:1040px}

.crumb{font-family:var(--sans);font-size:13px;color:var(--texto-3);margin:0 0 10px}
h1.titulo{font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.08;margin:0 0 14px}
.entradilla{font-size:19px;color:var(--texto-2);margin:0 0 28px;max-width:62ch}

h2.seccion{
  font-size:22px;font-weight:700;margin:44px 0 12px;padding-top:16px;
  border-top:1px solid var(--borde);
}
h3{font-size:17.5px;font-weight:600;margin:26px 0 8px;font-family:var(--sans)}
p{margin:0 0 14px;max-width:70ch}
ul,ol{margin:0 0 16px;padding-left:22px;max-width:70ch}
li{margin-bottom:7px}
li::marker{color:var(--campo)}
strong{font-weight:600}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9em;background:var(--campo-claro);padding:1px 5px;border-radius:4px}

/* ---------- portada ---------- */
.hero{position:relative;border-bottom:1px solid var(--borde);overflow:hidden;background:var(--blanco)}
.hero__grid{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--borde) 1px,transparent 1px),linear-gradient(90deg,var(--borde) 1px,transparent 1px);
  background-size:26px 26px;opacity:.5;
}
.hero__onda{position:absolute;left:0;right:0;bottom:0;height:210px;width:100%;display:block}
.hero__txt{position:relative;max-width:860px;margin:0 auto;padding:64px 40px 150px}
.hero h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;line-height:1.02;margin:0 0 16px;letter-spacing:-0.03em}
.hero p{font-size:19.5px;color:var(--texto-2);max-width:56ch;margin:0}
.hero__meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pastilla{
  font-family:var(--sans);font-size:13px;background:var(--campo-claro);color:var(--campo);
  padding:5px 12px;border-radius:100px;border:1px solid #D3DCFB;
}
.pastilla--ambar{background:var(--energia-claro);color:#9A6003;border-color:#F3DFB6}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;margin:22px 0 0}
.tarjeta{
  background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);
  padding:16px 17px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .15s;
}
.tarjeta:hover{border-color:var(--campo);transform:translateY(-2px)}
.tarjeta__n{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--campo)}
.tarjeta.hecho .tarjeta__n{color:var(--verde)}
.tarjeta__t{font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.25}
.tarjeta__d{font-size:14.5px;color:var(--texto-2);line-height:1.45}

/* ---------- buscador ---------- */
.buscador{position:relative;margin:0 0 6px}
.buscador input{
  width:100%;font:inherit;font-family:var(--sans);font-size:15px;
  padding:11px 14px;border:1px solid var(--borde-2);border-radius:9px;background:var(--blanco);color:var(--texto);
}
.buscador input::placeholder{color:var(--texto-3)}
.resultados{list-style:none;padding:0;margin:8px 0 0;max-width:none}
.resultados li{margin:0 0 6px}
.resultados button{
  width:100%;text-align:left;background:var(--blanco);border:1px solid var(--borde);border-radius:8px;
  padding:9px 12px;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--texto);
}
.resultados button:hover{border-color:var(--campo)}
.resultados small{display:block;color:var(--texto-3);font-size:12.5px}

/* ---------- fórmulas ---------- */
.formulario{display:grid;gap:10px;margin:16px 0 8px}
.formula{
  background:var(--blanco);border:1px solid var(--borde);border-left:3px solid var(--campo);
  border-radius:0 var(--radio) var(--radio) 0;padding:13px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;justify-content:space-between;
}
.formula__tex{font-size:18px;overflow-x:auto;max-width:100%}
.formula__d{font-family:var(--sans);font-size:13.5px;color:var(--texto-2);text-align:right;flex:1;min-width:180px}
.formula--clave{border-left-color:var(--energia);background:#FFFDF8}

/* ---------- avisos ---------- */
.aviso{
  background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);
  padding:16px 18px;margin:20px 0;
}
.aviso h4{margin:0 0 8px;font-size:15px;font-family:var(--sans);font-weight:600}
.aviso ul{margin-bottom:0}
.aviso--clave{background:var(--energia-claro);border-color:#F1DEBA}
.aviso--clave h4{color:#8A5604}
.aviso--dato{background:var(--campo-claro);border-color:#D3DCFB}
.aviso--dato h4{color:var(--campo)}

/* ---------- simulación ---------- */
.sim{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);margin:22px 0;overflow:hidden}
.sim__cab{padding:13px 17px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.sim__cab h4{margin:0;font-size:15.5px;font-family:var(--sans);font-weight:600}
.sim__cab span{font-family:var(--sans);font-size:13px;color:var(--texto-3)}
.sim__lienzo{display:block;width:100%;background:var(--blanco)}
.sim__mandos{padding:14px 17px;border-top:1px solid var(--borde);background:#FAFBFE;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.mando{font-family:var(--sans);font-size:13px;color:var(--texto-2)}
.mando__fila{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.mando b{color:var(--texto);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--campo);height:20px}
.sim__lectura{padding:12px 17px;border-top:1px solid var(--borde);display:flex;flex-wrap:wrap;gap:8px 26px;font-family:var(--sans);font-size:13.5px;background:#FAFBFE}
.sim__lectura b{font-variant-numeric:tabular-nums}
.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;
  background:var(--campo);color:#fff;border:0;border-radius:8px;padding:8px 15px;
}
.btn:hover{background:#2340C7}
.btn--fantasma{background:transparent;color:var(--campo);border:1px solid var(--borde-2)}
.btn--fantasma:hover{background:var(--campo-claro)}
.btn--verde{background:var(--verde)}
.btn--verde:hover{background:#0C6B4C}
.sim__botones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font-family:var(--sans);font-size:13.5px;padding:7px 10px;border:1px solid var(--borde-2);border-radius:8px;background:var(--blanco);color:var(--texto)}

/* ---------- test ---------- */
.test{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:18px 20px;margin:14px 0}
.test__p{font-family:var(--sans);font-weight:600;font-size:16px;margin:0 0 12px;display:flex;gap:10px}
.test__p i{color:var(--texto-3);font-style:normal;font-variant-numeric:tabular-nums}
.opciones{display:grid;gap:7px;margin:0;padding:0;list-style:none;max-width:none}
.opcion{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  border:1px solid var(--borde);background:var(--papel);border-radius:8px;
  padding:10px 13px;cursor:pointer;font:inherit;font-size:16px;line-height:1.45;color:var(--texto);
}
.opcion:hover:not(:disabled){border-color:var(--campo);background:var(--campo-claro)}
.opcion:disabled{cursor:default}
.opcion__l{font-family:var(--sans);font-weight:600;color:var(--texto-3);flex:none}
.opcion.bien{background:var(--verde-claro);border-color:#A8DCC9}
.opcion.bien .opcion__l{color:var(--verde)}
.opcion.mal{background:var(--rojo-claro);border-color:#EEC3C0}
.opcion.mal .opcion__l{color:var(--rojo)}
.explica{margin:11px 0 0;padding:11px 14px;background:var(--papel);border-left:3px solid var(--campo);border-radius:0 8px 8px 0;font-size:15.5px}
.explica[hidden]{display:none}

.marcador{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--tinta);color:#fff;border-radius:var(--radio);padding:16px 20px;margin:20px 0;
  font-family:var(--sans);
}
.marcador b{font-size:26px;font-weight:800}

/* ---------- problema resuelto ---------- */
.problema{border:1px solid var(--borde);border-radius:var(--radio);background:var(--blanco);margin:16px 0;overflow:hidden}
.problema__cab{padding:15px 18px}
.problema__cab h4{margin:0 0 8px;font-size:14.5px;font-family:var(--sans);color:var(--campo)}
.problema__cab p{margin:0}
.problema__sol{padding:0 18px 16px;border-top:1px dashed var(--borde-2);margin-top:12px;padding-top:14px}
.problema__sol[hidden]{display:none}
.problema__sol ol{margin-bottom:0}
.problema__sol li{margin-bottom:11px}

/* ---------- pie de tema ---------- */
.pie-tema{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:52px;padding-top:20px;border-top:1px solid var(--borde);flex-wrap:wrap}

/* ---------- tablas ---------- */
.tabla{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:15.5px;background:var(--blanco)}
.tabla th,.tabla td{border:1px solid var(--borde);padding:9px 12px;text-align:left;vertical-align:top}
.tabla th{background:var(--papel);font-family:var(--sans);font-size:13.5px;font-weight:600}
.tabla-envoltura{overflow-x:auto}

.katex{font-size:1.03em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;
    transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.3);
  }
  body.menu-abierto .rail{transform:none}
  .topbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;
    background:var(--tinta);color:#fff;padding:10px 14px;
  }
  .topbar button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:16px;line-height:1}
  .topbar span{font-family:var(--sans);font-weight:600;font-size:15px}
  .velo{position:fixed;inset:0;background:rgba(10,16,34,.55);z-index:35;display:none}
  body.menu-abierto .velo{display:block}
  .vista{padding:26px 20px 90px}
  .hero__txt{padding:40px 20px 120px}
  body{font-size:16.5px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

.mf{font-family:var(--serif);font-style:italic;white-space:nowrap}
.mf sub,.mf sup{font-style:normal}
.hero__grid,.hero__onda{pointer-events:none}
.test__p span{flex:1}
.opcion span:last-child{flex:1}

</style>
</head>
<body>
<div class="velo" id="velo"></div>

<header class="topbar">
  <button id="btnMenu" aria-label="Abrir el índice">&#9776;</button>
  <span id="tbTitulo">Física 2.º bach</span>
</header>

<div class="app">
  <aside class="rail" aria-label="Índice">
    <div class="rail__marca">
      <button id="marca" aria-label="Ir arriba">
        <span class="rail__titulo">Física</span>
        <span class="rail__sub">2.º bach</span>
      </button>
    </div>
    <nav class="rail__scroll" id="railScroll"></nav>
    <div class="rail__pie">
      <span id="progTexto">Aún no marcado como estudiado</span>
      <div class="barra"><i id="progBarra"></i></div>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<noscript><div class="vista"><h1 class="titulo">Activa JavaScript</h1><p>Esta página necesita JavaScript para mostrar el contenido, la simulación y el test.</p></div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
const R = String.raw;
const T1 = {
  n:1, id:"t1", titulo:"Movimientos vibratorios", lema:"El movimiento armónico simple",
  bloque:"C. Vibraciones y ondas",
  resumen:"Todo lo que oscila —un muelle, un péndulo, un átomo en un cristal, una molécula de aire al pasar el sonido— se describe con el mismo modelo: el movimiento armónico simple. Es el punto de partida de los dos temas siguientes.",
  secciones:[
    {h:"Qué es un movimiento armónico simple",
     p:[R`Un cuerpo describe un **movimiento armónico simple (MAS)** cuando oscila alrededor de una posición de equilibrio bajo la acción de una fuerza recuperadora proporcional a la separación de dicha posición y dirigida siempre hacia ella: $F = -k\,x$.`,
        R`Aplicando la segunda ley de Newton, $ma = -kx$, se llega a la condición cinemática que define el MAS: la aceleración es proporcional a la elongación y de signo contrario, $a = -\omega^2 x$, con $\omega^2 = k/m$.`],
     ul:[R`Es un movimiento **periódico** (se repite cada periodo $T$) y **oscilatorio** (va y viene entre $+A$ y $-A$).`,
         R`No es uniformemente acelerado: $a$ cambia en cada punto. En los extremos $a$ es máxima y $v=0$; en el equilibrio $a=0$ y $v$ es máxima.`,
         R`La proyección sobre un diámetro de un movimiento circular uniforme es un MAS. De ahí vienen los nombres de $\omega$ (pulsación o frecuencia angular) y de la fase.`]},
    {h:"Ecuaciones del movimiento",
     p:[R`La solución de $a=-\omega^2x$ es una función senoidal. Si se toma el seno, $x(t)=A\sin(\omega t+\varphi_0)$, y derivando se obtienen velocidad y aceleración.`,
        R`$A$ es la **amplitud** (elongación máxima), $\omega t+\varphi_0$ la **fase** y $\varphi_0$ la **fase inicial**, que se determina siempre con las condiciones iniciales del problema (dónde está y hacia dónde va el cuerpo en $t=0$).`],
     ul:[R`Si en $t=0$ el cuerpo parte del equilibrio hacia el sentido positivo: $\varphi_0 = 0$.`,
         R`Si parte de la elongación máxima positiva: $\varphi_0 = \pi/2$ (con la forma en seno) o bien se escribe directamente con coseno.`,
         R`La velocidad va adelantada $\pi/2$ respecto de la elongación, y la aceleración $\pi$ (están en oposición de fase).`]},
    {h:"Dinámica: muelle y péndulo",
     p:[R`En un **muelle** de constante elástica $k$ con una masa $m$ colgada o apoyada, $\omega=\sqrt{k/m}$: el periodo depende solo de la masa y del muelle, **no de la amplitud**.`,
        R`En un **péndulo simple** de longitud $l$, para oscilaciones pequeñas (menos de unos 10°) la componente tangencial del peso hace de fuerza recuperadora y $\omega=\sqrt{g/l}$. Aquí el periodo tampoco depende de la masa.`]},
    {h:"Energía del oscilador",
     p:[R`La fuerza elástica es conservativa, así que la energía mecánica se conserva y va intercambiándose entre cinética y potencial elástica a lo largo de cada oscilación.`,
        R`En los extremos toda la energía es potencial; en el punto de equilibrio, toda cinética. El valor total, $E_m=\tfrac12 k A^2$, depende del cuadrado de la amplitud: duplicar la amplitud multiplica por cuatro la energía.`]}
  ],
  formulas:[
    {tex:R`x(t)=A\sin(\omega t+\varphi_0)`, d:"Elongación", clave:true},
    {tex:R`v(t)=A\omega\cos(\omega t+\varphi_0)`, d:"Velocidad"},
    {tex:R`a(t)=-A\omega^2\sin(\omega t+\varphi_0)=-\omega^2x`, d:"Aceleración", clave:true},
    {tex:R`v=\pm\,\omega\sqrt{A^2-x^2}`, d:"Velocidad en función de la elongación"},
    {tex:R`\omega=\frac{2\pi}{T}=2\pi f`, d:"Pulsación, periodo y frecuencia"},
    {tex:R`F=-kx \qquad \omega=\sqrt{\frac{k}{m}} \qquad T=2\pi\sqrt{\frac{m}{k}}`, d:"Oscilador con muelle", clave:true},
    {tex:R`T=2\pi\sqrt{\frac{l}{g}}`, d:"Péndulo simple (amplitudes pequeñas)", clave:true},
    {tex:R`E_c=\tfrac12 m\omega^2(A^2-x^2)`, d:"Energía cinética"},
    {tex:R`E_p=\tfrac12 k x^2`, d:"Energía potencial elástica"},

    R`Trabaja siempre en radianes. Si la calculadora está en grados, todos los resultados saldrán mal.`,

    pasos:[

    pasos:[

    pasos:[

     op:["En los extremos de la trayectoria","En el punto de equilibrio","En x = A/2","En ningún punto"], sol:1,

     op:["0,39 s","1,57 s","3,14 s","16 s"], sol:1,

/* === Simulaciones: base común y temas 1-6 === */
const COL={tinta:"#14203F",campo:"#2B4CE0",energia:"#E9930B",gris:"#C6D0E6",grisC:"#EDF1F9",
  verde:"#12805C",rojo:"#C0322B",tx2:"#4E5B7C",morado:"#6B3FA0"};

let SIM_STOP=[];
function pararSims(){SIM_STOP.forEach(function(f){try{f();}catch(e){}});SIM_STOP=[];}

function nfmt(x,d){
  if(!isFinite(x))return "∞";
  if(x!==0&&(Math.abs(x)>=1e5||Math.abs(x)<1e-3)){
    var e=Math.floor(Math.log10(Math.abs(x))),m=x/Math.pow(10,e);
    return m.toFixed(2).replace(".",",")+"·10"+sup(e);
  }
  return x.toFixed(d===undefined?2:d).replace(".",",");
}
function sup(n){
  var s=String(n),r="",m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
  for(var i=0;i<s.length;i++)r+=m[s[i]]||s[i];
  return r;
}

/* Constructor genérico de simulación */
function crearSim(host,opts){
  var wrap=document.createElement("div");wrap.className="sim";
  var cab=document.createElement("div");cab.className="sim__cab";
  var h=document.createElement("h4");h.textContent=opts.titulo;
  var sp=document.createElement("span");sp.textContent=opts.nota||"";
  cab.appendChild(h);cab.appendChild(sp);wrap.appendChild(cab);

  var canvas=document.createElement("canvas");canvas.className="sim__lienzo";wrap.appendChild(canvas);
  var lect=document.createElement("div");lect.className="sim__lectura";wrap.appendChild(lect);
  var zona=document.createElement("div");zona.className="sim__mandos";wrap.appendChild(zona);
  host.appendChild(wrap);

  var ctx=canvas.getContext("2d"),W=0,H=0,v={},t0=performance.now(),animando=opts.anim!==false,raf=null,estado={};

  (opts.selects||[]).forEach(function(s){
    v[s.id]=s.val;
    var d=document.createElement("label");d.className="mando";
    var fila=document.createElement("div");fila.className="mando__fila";
    var sp2=document.createElement("span");sp2.textContent=s.label;fila.appendChild(sp2);
    d.appendChild(fila);
    var sel=document.createElement("select");
    s.opciones.forEach(function(o){var op=document.createElement("option");op.value=o.v;op.textContent=o.t;sel.appendChild(op);});
    sel.value=s.val;
    sel.addEventListener("change",function(){
      v[s.id]=isNaN(parseFloat(sel.value))?sel.value:(s.texto?sel.value:parseFloat(sel.value));
      if(s.numerico===false)v[s.id]=sel.value;
      if(opts.alCambiar)opts.alCambiar(v,estado);
      if(!animando)pintar();
    });
    d.appendChild(sel);zona.appendChild(d);
  });

  (opts.mandos||[]).forEach(function(m){
    v[m.id]=m.val;
    var d=document.createElement("label");d.className="mando";
    var fila=document.createElement("div");fila.className="mando__fila";
    var sp2=document.createElement("span");sp2.textContent=m.label;
    var b=document.createElement("b");
    fila.appendChild(sp2);fila.appendChild(b);d.appendChild(fila);
    var inp=document.createElement("input");inp.type="range";
    inp.min=m.min;inp.max=m.max;inp.step=m.step;inp.value=m.val;
    function pinta(){b.textContent=m.texto?m.texto(v[m.id]):(nfmt(v[m.id],m.dec)+(m.unidad?" "+m.unidad:""));}
    inp.addEventListener("input",function(){
      v[m.id]=parseFloat(inp.value);pinta();
      if(opts.alCambiar)opts.alCambiar(v,estado);
      if(!animando)pintar();
    });
    pinta();d.appendChild(inp);zona.appendChild(d);
  });

  if(opts.botones&&opts.botones.length){
    var cajaB=document.createElement("div");cajaB.className="mando sim__botones";
    opts.botones.forEach(function(bt){
      var b=document.createElement("button");b.className="btn btn--fantasma";b.textContent=bt.txt;
      b.addEventListener("click",function(){bt.accion(v,estado,b);if(!animando)pintar();});
      cajaB.appendChild(b);
    });
    zona.appendChild(cajaB);
  }

  function ajustar(){
    var w=canvas.clientWidth||600;
    var alto=Math.round(w*(opts.ratio||0.52));
    alto=Math.max(opts.minAlto||200,Math.min(opts.maxAlto||420,alto));
    var dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr;canvas.height=alto*dpr;
    canvas.style.height=alto+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W=w;H=alto;
  }

  var contador=0;
  function lecturas(){
    if(!opts.lecturas)return;
    var arr=opts.lecturas(v,estado,(performance.now()-t0)/1000);
    var html="";
    for(var i=0;i<arr.length;i++)html+="<span>"+arr[i][0]+" <b>"+arr[i][1]+"</b></span>";
    lect.innerHTML=html;
  }
  function pintar(){
    ctx.clearRect(0,0,W,H);
    opts.dibujar(ctx,W,H,v,(performance.now()-t0)/1000,estado);
    if(contador++%5===0)lecturas();
  }
  function bucle(){pintar();raf=requestAnimationFrame(bucle);}

  if(opts.iniciar)opts.iniciar(v,estado);
  ajustar();
  var onResize=function(){ajustar();if(!animando)pintar();};
  window.addEventListener("resize",onResize);

  if(opts.raton){
    var pos=function(ev){
      var r=canvas.getBoundingClientRect();
      var cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
      var cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
      return {x:cx,y:cy};
    };
    canvas.addEventListener("mousemove",function(ev){var p=pos(ev);opts.raton(p.x,p.y,v,estado,W,H);if(!animando)pintar();});
    canvas.addEventListener("mouseleave",function(){opts.raton(null,null,v,estado,W,H);if(!animando)pintar();});
  }

  if(animando)bucle();else pintar();
  SIM_STOP.push(function(){if(raf)cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);});
  return {canvas:canvas,v:v,pintar:pintar,estado:estado};
}

/* utilidades de dibujo */
function ejeH(ctx,x0,x1,y,color){ctx.strokeStyle=color||COL.gris;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();}
function txt(ctx,s,x,y,color,size,align){
  ctx.fillStyle=color||COL.tx2;
  ctx.font=(size||12)+"px 'Bricolage Grotesque', system-ui, sans-serif";
  ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);
}
function flecha(ctx,x1,y1,x2,y2,color,ancho){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<0.5)return;
  var ux=dx/L,uy=dy/L,c=Math.min(6,L*0.4);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=ancho||1.6;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-c*ux+c*0.5*uy,y2-c*uy-c*0.5*ux);
  ctx.lineTo(x2-c*ux-c*0.5*uy,y2-c*uy+c*0.5*ux);
  ctx.closePath();ctx.fill();
}

const SIMS={};


/* --- Tema 1: MAS --- */
SIMS.mas=function(host){
  return crearSim(host,{
    titulo:"Oscilador armónico: muelle y gráfica",
    nota:"Mueve los controles y observa cómo cambian x, v y a",
    ratio:0.5,
    mandos:[
      {id:"A",label:"Amplitud A",min:0.02,max:0.20,step:0.01,val:0.10,dec:2,unidad:"m"},
      {id:"T",label:"Periodo T",min:0.4,max:3,step:0.1,val:1.2,dec:1,unidad:"s"},
      {id:"f0",label:"Fase inicial φ₀",min:0,max:6.28,step:0.1,val:0,dec:2,unidad:"rad"}
    ],
    lecturas:function(v,e,t){
      var w=2*Math.PI/v.T,x=v.A*Math.sin(w*t+v.f0);
      return [["x =",nfmt(x,3)+" m"],["v =",nfmt(v.A*w*Math.cos(w*t+v.f0),2)+" m/s"],
              ["a =",nfmt(-v.A*w*w*Math.sin(w*t+v.f0),2)+" m/s²"],
              ["ω =",nfmt(w,2)+" rad/s"],["Eₘ ∝",nfmt(v.A*v.A*1000,1)+" (A²)"]];
    },
    dibujar:function(ctx,W,H,v,t){
      var w=2*Math.PI/v.T,yc=H*0.27,esc=(W*0.34)/0.20;
      var x=v.A*Math.sin(w*t+v.f0);
      var x0=W*0.14,xm=x0+W*0.36+x*esc;
      // guía y equilibrio
      ctx.setLineDash([4,4]);ctx.strokeStyle=COL.gris;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x0+W*0.36,yc-38);ctx.lineTo(x0+W*0.36,yc+30);ctx.stroke();ctx.setLineDash([]);
      txt(ctx,"equilibrio",x0+W*0.36,yc+40,COL.tx2,11,"center");
      // pared
      ctx.fillStyle=COL.tinta;ctx.fillRect(x0-10,yc-30,6,60);
      // muelle
      ctx.strokeStyle=COL.tx2;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0-4,yc);
      var n=14,L=xm-18-(x0-4);
      for(var i=0;i<=n;i++){var xx=x0-4+L*i/n,yy=yc+(i>0&&i<n?(i%2?-11:11):0);ctx.lineTo(xx,yy);}
      ctx.lineTo(xm-18,yc);ctx.stroke();
      // masa
      ctx.fillStyle=COL.campo;ctx.fillRect(xm-18,yc-20,36,40);
      txt(ctx,"m",xm,yc,"#fff",13,"center");
      // vectores v y a
      flecha(ctx,xm,yc-32,xm+v.A*w*Math.cos(w*t+v.f0)*26,yc-32,COL.verde,2);
      txt(ctx,"v",xm+6,yc-44,COL.verde,12);
      flecha(ctx,xm,yc+34,xm-v.A*w*w*Math.sin(w*t+v.f0)*8,yc+34,COL.rojo,2);
      txt(ctx,"a",xm+6,yc+48,COL.rojo,12);
      // gráfica
      var gy=H*0.74,gx0=W*0.08,gx1=W*0.94,dur=2.4*v.T;
      ejeH(ctx,gx0,gx1,gy);
      ctx.strokeStyle=COL.gris;ctx.beginPath();ctx.moveTo(gx0,gy-52);ctx.lineTo(gx0,gy+52);ctx.stroke();
      txt(ctx,"x(t)",gx0-4,gy-58,COL.tx2,12,"left");
      ctx.strokeStyle=COL.campo;ctx.lineWidth=2;ctx.beginPath();
      for(var p=0;p<=240;p++){
        var tt=t-dur+dur*p/240;
        var xx2=gx0+(gx1-gx0)*p/240,yy2=gy-v.A*Math.sin(w*tt+v.f0)*(46/0.20);
        p?ctx.lineTo(xx2,yy2):ctx.moveTo(xx2,yy2);
      }
      ctx.stroke();
      ctx.fillStyle=COL.energia;ctx.beginPath();ctx.arc(gx1,gy-x*(46/0.20),5,0,6.29);ctx.fill();
      txt(ctx,"ahora",gx1-6,gy+62,COL.tx2,11,"right");
      txt(ctx,"−2,4 T",gx0,gy+62,COL.tx2,11,"left");
    }
  });
};


/* === App de la página "Física" con portada + Tema 1 (sin preguntas) === */
function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var ESTADO={hecho:false,vista:"inicio"};

/* --- texto y fórmulas --- */
function texPlano(s){
  var g={alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",epsilon:"ε",varepsilon:"ε",eta:"η",
    theta:"θ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",varphi:"φ",
    Phi:"Φ",omega:"ω",Omega:"Ω",imath:"i"};
  s=s.replace(/\\hat\\imath/g,"î").replace(/\\hat\\jmath/g,"ĵ");
  for(var i=0;i<6;i++){
    s=s.replace(/\\[tdc]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,"($1)/($2)");
    s=s.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)");
    s=s.replace(/\\(mathrm|text|vec|hat|mathbf|operatorname)\s*\{([^{}]*)\}/g,"$2");
  }
  s=s.replace(/\\(vec|hat|mathrm|mathbf)\s*([A-Za-z])/g,"$2");
  s=s.replace(/\\left|\\right/g,"");
  s=s.replace(/\\cdot/g,"·").replace(/\\times/g,"×").replace(/\\pm/g,"±")
   .replace(/\\ge/g,"≥").replace(/\\le/g,"≤").replace(/\\approx/g,"≈")
   .replace(/\\Rightarrow/g,"⇒").replace(/\\rightarrow/g,"→").replace(/\\infty/g,"∞")
   .replace(/\\partial/g,"∂").replace(/\\oint/g,"∮").replace(/\\hbar/g,"ℏ")
   .replace(/\\ln/g,"ln").replace(/\\log/g,"log").replace(/\\sin/g,"sen")
   .replace(/\\cos/g,"cos").replace(/\\tan/g,"tg").replace(/\\circ/g,"°");
  for(var k in g)s=s.replace(new RegExp("\\\\"+k+"(?![a-zA-Z])","g"),g[k]);
  s=s.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^(-?\w)/g,"<sup>$1</sup>");
  s=s.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_(\w)/g,"<sub>$1</sub>");
  s=s.replace(/[{}]/g,"").replace(/\\[,;:!\s]/g," ").replace(/\\\\/g," ");
  return s;
}
function md(s){
  s=String(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  if(!window.katex)s=s.replace(/\$([^$]+)\$/g,function(m,t){return '<span class="mf">'+texPlano(t)+"</span>";});
  return s;
}
function pintaMate(el){
  if(window.katex&&window.renderMathInElement){
    try{renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});}catch(e){}
  }
  el.querySelectorAll("[data-tex]").forEach(function(n){
    var t=n.getAttribute("data-tex");
    if(window.katex){try{katex.render(t,n,{throwOnError:false,displayMode:false});return;}catch(e){}}
    n.innerHTML=texPlano(t);
  });
}
function cajaFormulas(lista){
  var cont=h("div","formulario");
  (lista||[]).forEach(function(f){
    var d=h("div","formula"+(f.clave?" formula--clave":""));
    var tex=h("span","formula__tex");tex.setAttribute("data-tex",f.tex);
    d.appendChild(tex);
    d.appendChild(h("span","formula__d",f.d));
    cont.appendChild(d);
  });
  return cont;
}

/* --- animación de la portada --- */
function heroOnda(){
  var c=document.getElementById("heroOnda");if(!c)return;
  var ctx=c.getContext("2d"),reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ajustar(){
    var dpr=window.devicePixelRatio||1;
    c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  ajustar();
  var t0=performance.now(),raf;
  function dib(){
    var W=c.clientWidth,H=c.clientHeight,t=reduce?0:(performance.now()-t0)/1000;
    ctx.clearRect(0,0,W,H);
    var ondas=[{a:26,k:0.011,w:0.7,y:0.62,col:"rgba(43,76,224,.16)"},
               {a:18,k:0.017,w:-1.0,y:0.72,col:"rgba(233,147,11,.20)"},
               {a:34,k:0.007,w:0.45,y:0.82,col:"rgba(20,32,63,.10)"}];
    ondas.forEach(function(o){
      ctx.beginPath();ctx.moveTo(0,H);
      for(var x=0;x<=W;x+=4)ctx.lineTo(x,H*o.y+Math.sin(x*o.k+t*o.w)*o.a);
      ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=o.col;ctx.fill();
    });
    if(!reduce)raf=requestAnimationFrame(dib);
  }
  dib();
  window.addEventListener("resize",function(){ajustar();if(reduce)dib();});
  SIM_STOP.push(function(){if(raf)cancelAnimationFrame(raf);});
}

/* --- índice y buscador (solo sobre el Tema 1) --- */
var IDX=null;
function indice(){
  var idx=[],T=T1;
  idx.push({t:T.titulo+" "+T.lema+" "+T.resumen,tit:T.titulo,sub:"Tema "+T.n});
  (T.secciones||[]).forEach(function(s){if(s.h)idx.push({t:s.h+" "+(s.p||[]).join(" ")+" "+(s.ul||[]).join(" "),tit:s.h,sub:"Tema "+T.n+", "+T.titulo});});
  (T.formulas||[]).forEach(function(f){idx.push({t:f.d+" "+f.tex,tit:f.d,sub:"Fórmula del tema "+T.n});});
  (T.claves||[]).forEach(function(k){idx.push({t:k,tit:k.replace(/\$[^$]*\$/g,"…").replace(/\*\*/g,""),sub:"Aviso del tema "+T.n});});
  return idx;
}
function buscar(q){
  var cont=document.getElementById("resultados");if(!cont)return;
  cont.innerHTML="";
  q=(q||"").trim().toLowerCase();
  if(q.length<3)return;
  if(!IDX)IDX=indice();
  var norm=function(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();};
  var qq=norm(q),vistos={},n=0;
  IDX.forEach(function(it){
    if(n>=7)return;
    if(norm(it.t).indexOf(qq)<0)return;
    if(vistos[it.tit])return;vistos[it.tit]=1;n++;
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.innerHTML=md(it.tit)+"<small>"+it.sub+"</small>";
    b.addEventListener("click",function(){ir("t1");});
    li.appendChild(b);cont.appendChild(li);
  });
  if(!n)cont.innerHTML='<li><button disabled>No hay resultados para esa búsqueda. Prueba con otra palabra.</button></li>';
  pintaMate(cont);
}

/* --- portada --- */
function vistaInicio(){
  var m=document.getElementById("main");m.innerHTML="";
  var hero=h("section","hero");
  hero.innerHTML='<div class="hero__grid"></div><canvas class="hero__onda" id="heroOnda"></canvas>'+
    '<div class="hero__txt"><h1>Física 2.º bach</h1>'+
    '<p>Isma es el mejor 😊</p>'
  m.appendChild(hero);

  var v=h("div","vista vista--ancha");
  var buscador=h("div","buscador");
  buscador.innerHTML='<input type="search" id="buscar" placeholder="Busca un concepto: péndulo, energía, fase inicial…" aria-label="Buscar en el tema">';
  v.appendChild(buscador);
  var res=h("ul","resultados");res.id="resultados";v.appendChild(res);

  var rej=h("div","rejilla");
  var c=h("button","tarjeta"+(ESTADO.hecho?" hecho":""));
  c.innerHTML='<span class="tarjeta__n">Tema '+T1.n+(ESTADO.hecho?" estudiado":"")+'</span>'+
    '<span class="tarjeta__t">'+T1.titulo+'</span><span class="tarjeta__d">'+T1.lema+"</span>";
  c.addEventListener("click",function(){ir("t1");});
  rej.appendChild(c);
  v.appendChild(rej);

  var extra=h("div");
  extra.innerHTML='<h2 class="seccion"></h2>'+
    "<p></p>";
  v.appendChild(extra);
  m.appendChild(v);

  heroOnda();
  var inp=document.getElementById("buscar");
  inp.addEventListener("input",function(){buscar(inp.value);});
}

/* --- vista de tema (sin preguntas) --- */
function vistaTema(T){
  var m=document.getElementById("main");m.innerHTML="";
  var v=h("div","vista");
  v.appendChild(h("p","crumb","Tema "+T.n+" · Bloque "+T.bloque));
  v.appendChild(h("h1","titulo",T.titulo+". "+T.lema));
  v.appendChild(h("p","entradilla",md(T.resumen)));

  (T.secciones||[]).forEach(function(s){
    if(s.h)v.appendChild(h("h2","seccion",s.h));
    (s.p||[]).forEach(function(p){v.appendChild(h("p",null,md(p)));});
    if(s.ul){
      var ul=h("ul");
      s.ul.forEach(function(li){ul.appendChild(h("li",null,md(li)));});
      v.appendChild(ul);
    }
  });

  v.appendChild(h("h2","seccion","Formulario del tema"));
  v.appendChild(cajaFormulas(T.formulas));

  var pie=h("div","pie-tema");
  var marcar=h("button","btn"+(ESTADO.hecho?" btn--verde":""),ESTADO.hecho?"Tema estudiado":"Marcar como estudiado");
  marcar.addEventListener("click",function(){
    ESTADO.hecho=!ESTADO.hecho;
    marcar.textContent=ESTADO.hecho?"Tema estudiado":"Marcar como estudiado";
    marcar.className="btn"+(ESTADO.hecho?" btn--verde":"");
    pintarRail();
  });
  pie.appendChild(marcar);
  var volver=h("button","btn btn--fantasma","Volver a la portada");
  volver.addEventListener("click",function(){ir("inicio");});
  pie.appendChild(volver);
  v.appendChild(pie);

  m.appendChild(v);
  pintaMate(v);
}

/* --- barra lateral --- */
function pintarRail(){
  var cont=document.getElementById("railScroll");
  cont.innerHTML="";
  cont.appendChild(h("div","rail__grupo","Navegación"));
  var bi=h("button","nav-item");
  bi.setAttribute("aria-current",ESTADO.vista==="inicio"?"true":"false");
  bi.innerHTML='<span class="nav-item__n"><span>·</span></span><span class="nav-item__txt">Portada</span>';
  bi.addEventListener("click",function(){ir("inicio");});
  cont.appendChild(bi);

  var bt=h("button","nav-item"+(ESTADO.hecho?" hecho":""));
  bt.setAttribute("aria-current",ESTADO.vista==="t1"?"true":"false");
  bt.innerHTML='<span class="nav-item__n"><span>1</span></span><span class="nav-item__txt">'+T1.titulo+'</span>';
  bt.addEventListener("click",function(){ir("t1");});
  cont.appendChild(bt);

  document.getElementById("progTexto").textContent=ESTADO.hecho?"1 de 1 tema marcado":"0 de 1 tema marcado";
  document.getElementById("progBarra").style.width=ESTADO.hecho?"100%":"0%";
}

/* --- enrutado --- */
function ir(id){
  pararSims();
  ESTADO.vista=id;
  try{if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);}catch(e){}
  document.body.classList.remove("menu-abierto");
  if(id==="t1")vistaTema(T1);else{ESTADO.vista="inicio";vistaInicio();}
  pintarRail();
  document.getElementById("tbTitulo").textContent=ESTADO.vista==="t1"?"Tema 1":"Física 2.º bach";
  window.scrollTo(0,0);
  document.getElementById("main").focus({preventScroll:true});
}

/* --- arranque --- */
(function(){
  document.getElementById("btnMenu").addEventListener("click",function(){document.body.classList.toggle("menu-abierto");});
  document.getElementById("velo").addEventListener("click",function(){document.body.classList.remove("menu-abierto");});
  document.getElementById("marca").addEventListener("click",function(){ir("inicio");});
  var inicial="inicio";
  try{inicial=(location.hash||"").replace("#","")||"inicio";}catch(e){}
  ir(inicial);
  window.addEventListener("hashchange",function(){
    try{
      var id=(location.hash||"").replace("#","")||"inicio";
      if(id!==ESTADO.vista)ir(id);
    }catch(e){}
  });
})();
